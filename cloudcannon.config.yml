# CloudCannon — Emmanuel Church (experiment branch)
# Greenfield model: page copy lives in each .njk front matter.
# Separate collections only for shared inventories (people, services, rates, events).

# Do not auto-discover extra collections (old Site Pages / Site Images / News).
collections_config_override: true

source_editor:
  tab_size: 2
  theme: monokai

paths:
  uploads: assets/uploads
  static: ''
  data: _data
  collections: ''

_structures:
  documents:
    values:
      - label: Document link
        icon: description
        value:
          title: New document
          description: PDF · Add a short subtitle
          href: https://
          icon: document
  projects:
    values:
      - label: Outreach project
        icon: volunteer_activism
        value:
          title: New project
          body: ''
          image: ''
          image_alt: ''
  sacrament_cards:
    values:
      - label: Sacrament section
        icon: auto_stories
        value:
          eyebrow: ''
          title: New section
          body: ''
          images: []
  sacrament_images:
    values:
      - label: Image
        icon: image
        value:
          image: ''
          alt: ''
  cards:
    values:
      - label: Card
        icon: web_asset
        value:
          eyebrow: ''
          title: New card
          body: ''
  featured_services:
    values:
      - label: Service (from Service Times)
        icon: schedule
        value:
          slug: sung-eucharist
  featured_people:
    values:
      - label: Person (from Who's Who)
        icon: person
        value:
          slug: will-rose
  intro_paragraphs:
    values:
      - label: Paragraph
        icon: notes
        value:
          text: ''
  wedding_images:
    values:
      - label: Photo
        icon: image
        value:
          image: ''
          image_alt: ''
  bio_paragraphs:
    values:
      - label: Paragraph
        icon: notes
        value: ''
  posters:
    values:
      - label: Poster
        icon: image
        value:
          url: ''
          alt: ''

collections_config:
  # New key (pages) so CloudCannon drops the stale "Website pages (visual)" collection.
  pages:
    path: _templates/ui_kits/website
    name: Pages
    icon: web
    glob:
      - annual-reports.njk
      - baptisms.njk
      - children-families.njk
      - contact.njk
      - donations.njk
      - emmanuel-school.njk
      - community-outreach.njk
      - funerals.njk
      - history.njk
      - im-new.njk
      - index.njk
      - music.njk
      - our-team.njk
      - privacy-policy.njk
      - room-hire.njk
      - safeguarding.njk
      - service-times.njk
      - st-cuthberts.njk
      - weddings.njk
    url: '[permalink]'
    # Data editor only. The visual editor re-serialises the whole .njk file as
    # HTML, which mangles the Nunjucks tags in the page body and breaks the
    # build (see the music.njk outage). All editable copy lives in front
    # matter, so the data editor reaches 100% of it with none of that risk.
    _enabled_editors:
      - data
    preview:
      text:
        - key: headline
        - template: '{basename}'
      subtext:
        - key: permalink
      image:
        - key: hero_image
        - key: feature_image

  service_times:
    path: _data/cms/service-times
    name: Service Times
    icon: schedule
    glob:
      - '*.json'
    _enabled_editors:
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/service-time.json
        name: Service time
    create:
      path: '[relative_base_path]/{name|slugify}.json'
    preview:
      text:
        - key: name
      subtext:
        - key: day
        - key: time

  people:
    path: _data/cms/people
    name: Who's Who
    icon: people
    glob:
      - '*.json'
    _enabled_editors:
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/person.json
        name: Person
    create:
      path: '[relative_base_path]/{name|slugify}.json'
    preview:
      text:
        - key: name
      subtext:
        - key: role
      image:
        - key: photoUrl

  room_rates:
    path: _data/cms/room-rates
    name: Room Hire Rates
    icon: meeting_room
    glob:
      - '*.json'
    _enabled_editors:
      - data
    preview:
      text:
        - key: room
      subtext:
        - key: rate

  events:
    path: _data/cms/events
    name: Events & Calendar
    icon: event
    glob:
      - '*.json'
    _enabled_editors:
      - data
    preview:
      text:
        - key: title
      subtext:
        - key: display_date
        - key: date
      image:
        - key: posters.0.url
    # Title first, then the three optional details. Scoped to this collection
    # because `body` is an array of paragraphs here but a plain textarea
    # elsewhere on the site.
    _order:
      - title
      - deck
      - date
      - display_date
      - display_time
      - where
      - body
      - posters
      - featured
    _inputs:
      deck:
        type: textarea
        label: Subtitle
        comment: Shown under the title on the event page, and as the description
          on the events and home page cards.
      date:
        type: datetime
        label: Date & time
        comment: When the event happens. Sorts the event and places it on the
          calendar. Leave the time at 00:00 if there is no set time.
      display_date:
        type: text
        label: Display date (optional)
        comment: Overrides how the date reads on the page — use for a range, e.g.
          "Palm Sunday — Easter Day · 2026". Leave blank to show the date above.
      display_time:
        type: text
        label: Display time (optional)
        comment: Overrides how the time reads, e.g. "10:30 Mass & 6:30pm Evensong".
          Leave blank to show the time above.
      where:
        type: text
        label: Where
        comment: Optional, e.g. "Emmanuel Church & garden".
      body:
        type: html
        label: Body
        comment: The main event description. Use a blank line for a new paragraph.
        options:
          bold: true
          italic: true
          link: true
          bulletedlist: true
          numberedlist: true
          undo: true
          redo: true
          removeformat: true
      featured:
        type: switch
        label: Featured
        comment: Show this event in the highlighted slot on the events page.
      slug:
        type: text
        hidden: true

  other_events:
    path: _data/cms/other-events
    name: Other Events
    icon: event
    glob:
      - '*.json'
    _enabled_editors:
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/other-event.json
        name: Other event
    create:
      path: '[relative_base_path]/{title|slugify}.json'
    preview:
      text:
        - key: title
      subtext:
        - key: date
        - key: time

_inputs:
  headline:
    type: text
  deck:
    type: textarea
  lead:
    type: textarea
  intro_paragraphs:
    type: array
    options:
      structures: _structures.intro_paragraphs
  archive_note:
    type: textarea
  callout_heading:
    type: text
  callout_body:
    type: textarea
  clergy_label:
    type: text
  staff_label:
    type: text
  documents:
    type: array
    options:
      structures: _structures.documents
  projects:
    type: array
    label: Outreach projects
    comment: Each project can optionally carry one photograph.
    options:
      structures: _structures.projects
  image_alt:
    type: text
    label: Alt text
    comment: Describe the photograph for anyone using a screen reader. Leave the image empty to show text only.
  intro_image:
    type: image
    options:
      path: assets/cms/site-images
  intro_image_alt:
    type: text
    label: Alt text
  help_heading:
    type: text
    label: Help card heading
  help_body:
    type: textarea
    label: Help card text
  help_link_label:
    type: text
    label: Help card button
    comment: Links to the Contact page.
  aside_image:
    type: image
    options:
      path: assets/cms/site-images
  aside_image_alt:
    type: text
    label: Alt text
  sacrament_cards:
    type: array
    label: Sacraments
    comment: Full-width sections. Add more than one image to a section and it becomes a slider.
    options:
      structures: _structures.sacrament_cards
  images:
    type: array
    label: Images
    comment: One image shows on its own; two or more become a slider.
    options:
      structures: _structures.sacrament_images
  image:
    type: image
    label: Image
    options:
      path: assets/cms/site-images
  alt:
    type: text
    label: Alt text
    comment: Describe the photograph for anyone using a screen reader.
  cards:
    type: array
    options:
      structures: _structures.cards
  access_cards:
    type: array
    options:
      structures: _structures.cards
  cost_cards:
    type: array
    options:
      structures: _structures.cards
  volunteer_cards:
    type: array
    options:
      structures: _structures.cards
  featured_services:
    type: array
    options:
      structures: _structures.featured_services
  featured_people:
    type: array
    options:
      structures: _structures.featured_people
  wedding_images:
    type: array
    label: Photos
    comment: Add any number of photos — they lay out four per row.
    options:
      structures: _structures.wedding_images
  photos:
    type: array
    label: Photos
    comment: Add up to three photos — they lay out three per row.
    options:
      structures: _structures.wedding_images
  image_alt:
    type: text
    label: Alt text
    comment: Describe the photograph for anyone using a screen reader.
  slug:
    type: select
    label: Collection item
    options:
      values:
        - sung-eucharist
        - said-eucharist-bcp
        - joyful-noise-eucharist
        - contemplative-eucharist
        - healing-eucharist
        - morning-prayer
        - school-collective-worship
        - will-rose
        - joseph-verdin
        - the-reverend-dr-catriona-laing
        - mthr-clemency-flitter
        - mthr-melissa-dickinson
        - emma-clark
        - claire-hammett
        - antony-edwards
  title:
    type: text
  body:
    type: textarea
  eyebrow:
    type: text
  description:
    type: textarea
  href:
    type: url
    label: Link URL
  icon:
    type: select
    label: Row icon
    options:
      values:
        - document
        - folder
  day:
    type: select
    options:
      values:
        - Sunday
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Mon–Thu
  group:
    type: select
    options:
      values:
        - sunday
        - weekday
        - clergy
        - staff
        - churchwardens
        - pcc
  active:
    type: switch
  featured:
    type: switch
  photoUrl:
    type: image
    label: Photo
  bio:
    type: array
    label: Biography
    comment: One paragraph per item
    options:
      structures: _structures.bio_paragraphs
  name:
    type: text
  role:
    type: text
  time:
    type: text
  order:
    type: number
  hero_image:
    type: image
  feature_image:
    type: image
  posters:
    type: array
    label: Posters
    comment: The first poster is used as the thumbnail in listings.
    options:
      structures: _structures.posters
  # Structural fields — visible but never editable, so an editor cannot
  # break a page's URL or the build.
  permalink:
    type: text
    hidden: true
  _id:
    type: text
    hidden: true
