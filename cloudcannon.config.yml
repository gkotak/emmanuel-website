# CloudCannon — Emmanuel Church (experiment branch)
# Greenfield model: page copy lives in each .njk front matter.
# Separate collections only for shared inventories (people, services, rates, events).

# Do not auto-discover extra collections (old Site Pages / Site Images / News).
collections_config_override: true

# Date and time inputs are entered and shown in UK local time (GMT in winter,
# BST in summer) rather than UTC.
timezone: Europe/London

source_editor:
  tab_size: 2
  theme: monokai

paths:
  uploads: assets/uploads
  static: ''
  data: _data
  collections: ''

_structures:
  event_schedule:
    id_key: _type
    style: select
    values:
      - label: Once
        icon: event
        value:
          _type: once
          date: ''
      - label: Every week
        icon: repeat
        value:
          _type: weekly
          weekday: Sunday
      - label: Every month
        icon: calendar_month
        value:
          _type: monthly
          day_of_month: 1
  callout:
    values:
      - label: Callout
        icon: campaign
        value:
          heading: New callout heading
          body: ''
          primary_button: []
          secondary_button: []
  primary_button:
    values:
      - label: Primary button (orange)
        icon: smart_button
        value:
          label: Button label
          href: https://
  secondary_button:
    values:
      - label: Secondary button (outlined)
        icon: smart_button
        value:
          label: Button label
          href: https://
  documents:
    values:
      - label: Document link
        icon: description
        value:
          title: New document
          description: PDF · Add a short subtitle
          href: https://
          icon: document
  projects:
    values:
      - label: Outreach project
        icon: volunteer_activism
        value:
          title: New project
          body: ''
          image: ''
          image_alt: ''
  sacrament_cards:
    values:
      - label: Sacrament section
        icon: auto_stories
        value:
          eyebrow: ''
          title: New section
          body: ''
          images: []
  sacrament_images:
    values:
      - label: Image
        icon: image
        value:
          image: ''
          alt: ''
  cards:
    values:
      - label: Card
        icon: web_asset
        value:
          eyebrow: ''
          title: New card
          body: ''
  featured_services:
    values:
      - label: Service (from Service Times)
        icon: schedule
        value:
          slug: sung-eucharist
  featured_people:
    values:
      - label: Person (from Who's Who)
        icon: person
        value:
          slug: will-rose
  intro_paragraphs:
    values:
      - label: Paragraph
        icon: notes
        value:
          text: ''
  wedding_images:
    values:
      - label: Photo
        icon: image
        value:
          image: ''
          image_alt: ''
  bio_paragraphs:
    values:
      - label: Paragraph
        icon: notes
        value: ''
  posters:
    values:
      - label: Poster
        icon: image
        value:
          url: ''
          alt: ''

collections_config:
  # New key (pages) so CloudCannon drops the stale "Website pages (visual)" collection.
  pages:
    path: _templates/ui_kits/website
    name: Pages
    icon: web
    glob:
      - annual-reports.njk
      - baptisms.njk
      - children-families.njk
      - churchsuite.njk
      - contact.njk
      - donations.njk
      - electoral-roll.njk
      - emmanuel-school.njk
      - community-outreach.njk
      - funerals.njk
      - history.njk
      - im-new.njk
      - index.njk
      - music.njk
      - our-team.njk
      - privacy-policy.njk
      - room-hire.njk
      - safeguarding.njk
      - service-times.njk
      - st-cuthberts.njk
      - weddings.njk
    url: '[permalink]'
    # Data editor only. The visual editor re-serialises the whole .njk file as
    # HTML, which mangles the Nunjucks tags in the page body and breaks the
    # build (see the music.njk outage). All editable copy lives in front
    # matter, so the data editor reaches 100% of it with none of that risk.
    _enabled_editors:
      - data
    preview:
      text:
        - key: title
        - template: '{basename}'
      subtext:
        - key: permalink
      image:
        - key: hero_image
        - key: feature_image

  service_times:
    path: _data/cms/service-times
    name: Service Times
    icon: schedule
    glob:
      - '*.json'
    _enabled_editors:
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/service-time.json
        name: Service time
    create:
      path: '[relative_base_path]/{name|slugify}.json'
    disable_add_folder: true
    # Data collections default to read-only file actions; allow delete/rename.
    disable_file_actions: false
    disable_add_folder_menu: true
    preview:
      text:
        - key: name
      subtext:
        - key: day
        - key: time

  people:
    path: _data/cms/people
    name: Who's Who
    icon: people
    glob:
      - '*.json'
    _enabled_editors:
      - data
    disable_file_actions: false
    schemas:
      default:
        path: .cloudcannon/schemas/person.json
        name: Person
    create:
      path: '[relative_base_path]/{name|slugify}.json'
    preview:
      text:
        - key: name
      subtext:
        - key: role
      image:
        - key: photoUrl

  room_rates:
    path: _data/cms/room-rates
    name: Room Hire Rates
    icon: meeting_room
    glob:
      - '*.json'
    _enabled_editors:
      - data
    disable_file_actions: false
    preview:
      text:
        - key: room
      subtext:
        - key: rate

  events:
    path: _data/cms/events
    name: Special Events
    icon: event
    glob:
      - '*.json'
    _enabled_editors:
      - data
    disable_file_actions: false
    preview:
      text:
        - key: title
      subtext:
        - key: display_date
        - key: date
      image:
        - key: posters.0.url
    # Title first, then the three optional details. Scoped to this collection
    # because `body` is an array of paragraphs here but a plain textarea
    # elsewhere on the site.
    _order:
      - title
      - deck
      - date
      - start_time
      - end_time
      - display_date
      - where
      - body
      - posters
      - featured
    _inputs:
      deck:
        type: textarea
        label: Subtitle
        comment: Shown under the title on the event page, and as the description
          on the events and home page cards.
      date:
        type: date
        label: Date
        comment: Sorts the event and places it on the calendar.
      start_time:
        type: time
        label: Start time (optional)
        comment: UK time. Leave blank if there is no set time — the Time row is
          then hidden on the page.
      end_time:
        type: time
        label: End time (optional)
      display_date:
        type: text
        label: Display date (optional)
        comment: Overrides how the date reads on the page — use for a range, e.g.
          "Palm Sunday — Easter Day · 2026". Leave blank to show the date above.
      url:
        type: image
        label: Poster image
        comment: Upload a poster, or paste the address of one already online.
      uploadUrl:
        type: text
        hidden: true
      alt:
        type: text
        label: Alt text
        comment: Describe the poster for anyone using a screen reader.
      where:
        type: text
        label: Where
        comment: Optional, e.g. "Emmanuel Church & garden".
      body:
        type: html
        label: Body
        comment: The main event description. Use a blank line for a new paragraph.
        options:
          bold: true
          italic: true
          link: true
          bulletedlist: true
          numberedlist: true
          undo: true
          redo: true
          removeformat: true
      featured:
        type: switch
        label: Featured
        comment: Show this event in the highlighted slot on the events page.
      slug:
        type: text
        hidden: true

  other_events:
    path: _data/cms/other-events
    name: Other Events
    icon: event
    glob:
      - '*.json'
    _enabled_editors:
      - data
    _order:
      - title
      - schedule
      - start_time
      - end_time
      - description
    _inputs:
      # Picking how the event repeats swaps in only that option's fields,
      # so a one-off never shows a weekday and a weekly never shows a date.
      schedule:
        type: object
        label: When
        options:
          structures: _structures.event_schedule
      date:
        type: date
        label: Date
      weekday:
        type: select
        label: Day of the week
        options:
          values:
            - Sunday
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
      day_of_month:
        type: number
        label: Day of the month
        comment: 1 to 31.
    schemas:
      default:
        path: .cloudcannon/schemas/other-event.json
        name: Other event
    create:
      path: '[relative_base_path]/{title|slugify}.json'
    disable_add_folder: true
    # Data collections default to read-only file actions; allow delete/rename.
    disable_file_actions: false
    disable_add_folder_menu: true
    preview:
      text:
        - key: title
      subtext:
        - key: date
        - key: time

_inputs:
  title:
    type: text
  subtitle:
    type: textarea
  lead:
    type: textarea
  intro_content:
    type: markdown
  archive_note:
    type: textarea
  callout:
    type: array
    label: Callout
    comment: Optional. A closing call-to-action band shown just above the footer. Add one item to enable it; remove it to hide it. Requires a heading or body.
    options:
      structures: _structures.callout
      min: 0
      max: 1
  heading:
    type: text
    label: Heading
  primary_button:
    type: array
    label: Primary button (orange)
    comment: Optional. At most one.
    options:
      structures: _structures.primary_button
      min: 0
      max: 1
  secondary_button:
    type: array
    label: Secondary button (outlined)
    comment: Optional. At most one.
    options:
      structures: _structures.secondary_button
      min: 0
      max: 1
  label:
    type: text
    label: Button label
  aside_heading:
    type: text
    label: Aside heading
  aside_body:
    type: textarea
    label: Aside text
  travel_heading:
    type: text
    label: Travel heading
  travel_lead:
    type: textarea
    label: Travel intro
  access_heading:
    type: text
    label: "Section heading: how to get access"
  invited_heading:
    type: text
    label: "Section heading: already invited"
  clergy_label:
    type: text
  staff_label:
    type: text
  documents:
    type: array
    options:
      structures: _structures.documents
  projects:
    type: array
    label: Outreach projects
    comment: Each project can optionally carry one photograph.
    options:
      structures: _structures.projects
  image_alt:
    type: text
    label: Alt text
    comment: Describe the photograph for anyone using a screen reader. Leave the image empty to show text only.
  intro_image:
    type: image
    options:
      path: assets/cms/site-images
  intro_image_alt:
    type: text
    label: Alt text
  help_heading:
    type: text
    label: Help card heading
  help_body:
    type: textarea
    label: Help card text
  help_link_label:
    type: text
    label: Help card button
    comment: Links to the Contact page.
  aside_image:
    type: image
    options:
      path: assets/cms/site-images
  aside_image_alt:
    type: text
    label: Alt text
  sacrament_cards:
    type: array
    label: Sacraments
    comment: Full-width sections. Add more than one image to a section and it becomes a slider.
    options:
      structures: _structures.sacrament_cards
  images:
    type: array
    label: Images
    comment: One image shows on its own; two or more become a slider.
    options:
      structures: _structures.sacrament_images
  image:
    type: image
    label: Image
    options:
      path: assets/cms/site-images
  alt:
    type: text
    label: Alt text
    comment: Describe the photograph for anyone using a screen reader.
  cards:
    type: array
    options:
      structures: _structures.cards
  access_cards:
    type: array
    options:
      structures: _structures.cards
  cost_cards:
    type: array
    options:
      structures: _structures.cards
  volunteer_cards:
    type: array
    options:
      structures: _structures.cards
  featured_services:
    type: array
    options:
      structures: _structures.featured_services
  featured_people:
    type: array
    options:
      structures: _structures.featured_people
  wedding_images:
    type: array
    label: Photos
    comment: Add any number of photos — they lay out four per row.
    options:
      structures: _structures.wedding_images
  photos:
    type: array
    label: Photos
    comment: Add up to three photos — they lay out three per row.
    options:
      structures: _structures.wedding_images
  image_alt:
    type: text
    label: Alt text
    comment: Describe the photograph for anyone using a screen reader.
  slug:
    type: select
    label: Collection item
    options:
      values:
        - sung-eucharist
        - said-eucharist-bcp
        - joyful-noise-eucharist
        - contemplative-eucharist
        - healing-eucharist
        - morning-prayer
        - school-collective-worship
        - will-rose
        - joseph-verdin
        - the-reverend-dr-catriona-laing
        - mthr-clemency-flitter
        - mthr-melissa-dickinson
        - emma-clark
        - claire-hammett
        - antony-edwards
  title:
    type: text
  body:
    type: textarea
  eyebrow:
    type: text
  description:
    type: textarea
  href:
    type: url
    label: Link URL
  icon:
    type: select
    label: Row icon
    options:
      values:
        - document
        - folder
  day:
    type: select
    options:
      values:
        - Sunday
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Mon–Thu
  group:
    type: select
    options:
      values:
        - sunday
        - weekday
        - clergy
        - staff
        - churchwardens
        - pcc
  active:
    type: switch
  featured:
    type: switch
  photoUrl:
    type: image
    label: Photo
    options:
      path: assets/cms/people
  bio:
    type: array
    label: Biography
    comment: One paragraph per item
    options:
      structures: _structures.bio_paragraphs
  name:
    type: text
  role:
    type: text
  # Times are entered 24-hour and shown on the site as am/pm.
  start_time:
    type: time
    label: Start time
  end_time:
    type: time
    label: End time (optional)
    comment: Leave blank if the end time is not fixed — only the start shows.
  order:
    type: number
  hero_image:
    type: image
    options:
      path: assets/cms/site-images
  welcome_image:
    type: image
    label: Welcome image
    options:
      path: assets/cms/site-images
  room_image:
    type: image
    label: Room image
    options:
      path: assets/cms/site-images
  history_image_1:
    type: image
    label: History image 1
    options:
      path: assets/cms/site-images
  history_image_2:
    type: image
    label: History image 2
    options:
      path: assets/cms/site-images
  history_image_3:
    type: image
    label: History image 3
    options:
      path: assets/cms/site-images
  feature_image:
    type: image
    label: Feature image
    options:
      path: assets/cms/page-images
  feature_image_alt:
    type: text
    label: Feature image alt text
    comment: Describe the photograph for anyone using a screen reader.
  hero_image_alt:
    type: text
    label: Hero image alt text
    comment: Describe the photograph for anyone using a screen reader.
  welcome_image_alt:
    type: text
    label: Welcome image alt text
    comment: Describe the photograph for anyone using a screen reader.
  posters:
    type: array
    label: Posters
    comment: The first poster is used as the thumbnail in listings.
    options:
      structures: _structures.posters
  # Structural fields — visible but never editable, so an editor cannot
  # break a page's URL or the build.
  permalink:
    type: text
    hidden: true
  _id:
    type: text
    hidden: true
