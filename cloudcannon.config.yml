# CloudCannon — Emmanuel Church (experiment branch)
# Collections are folders of one JSON file per item (Sanity-like list UI).

source_editor:
  tab_size: 2
  theme: monokai

paths:
  uploads: assets/uploads
  static: ''
  data: _data
  collections: ''

collections_config:
  website_pages:
    path: _templates/ui_kits/website
    name: Website pages (visual)
    icon: web
    glob:
      - annual-reports.njk
    url: '/ui_kits/website/annual-reports.html'
    _enabled_editors:
      - visual
      - data
    preview:
      text:
        - key: headline
        - template: '{basename}'
      subtext:
        - key: permalink

  service_times:
    path: _data/cms/service-times
    name: Service Times
    icon: schedule
    glob:
      - '*.json'
    _enabled_editors:
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/service-time.json
        name: Service time
    create:
      path: '[relative_base_path]/{name|slugify}.json'

  people:
    path: _data/cms/people
    name: Who's Who
    icon: people
    glob:
      - '*.json'
    _enabled_editors:
      - data
    schemas:
      default:
        path: .cloudcannon/schemas/person.json
        name: Person
    create:
      path: '[relative_base_path]/{name|slugify}.json'

  room_rates:
    path: _data/cms/room-rates
    name: Room Hire Rates
    icon: meeting_room
    glob:
      - '*.json'
    _enabled_editors:
      - data

  events:
    path: _data/cms/events
    name: Events & Calendar
    icon: event
    glob:
      - '*.json'
    _enabled_editors:
      - data

  news:
    path: _data/cms/news
    name: News
    icon: newspaper
    glob:
      - '*.json'
    _enabled_editors:
      - data

  site_images:
    path: _data/cms/site-images
    name: Site Images
    icon: image
    glob:
      - '*.json'
    _enabled_editors:
      - data
    preview:
      text:
        - key: label
      subtext:
        - key: key
      image:
        - key: image
        - key: url
    schemas:
      default:
        path: .cloudcannon/schemas/site-image.json
        name: Site image

  site_pages:
    path: _data/cms/pages
    name: Site Pages
    icon: article
    glob:
      - '*.json'
    _enabled_editors:
      - data

_inputs:
  headline:
    type: text
  deck:
    type: textarea
  lead:
    type: textarea
  callout_heading:
    type: text
  callout_body:
    type: textarea
  report_title:
    type: text
  report_desc:
    type: text
  statements_title:
    type: text
  statements_desc:
    type: text
  archive_note:
    type: textarea
  day:
    type: select
    options:
      values:
        - Sunday
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Mon–Thu
  group:
    type: select
    options:
      values:
        - sunday
        - weekday
        - clergy
        - staff
        - churchwardens
        - pcc
  active:
    type: switch
  featured:
    type: switch
  url:
    type: image
    label: Image
  image:
    type: image
    label: Image
  photoUrl:
    type: image
    label: Photo
  bio:
    type: array
    comment: One paragraph per item
  headline:
    type: text
  deck:
    type: textarea
  calloutHeading:
    type: text
  name:
    type: text
  role:
    type: text
  time:
    type: text
  description:
    type: textarea
  order:
    type: number
