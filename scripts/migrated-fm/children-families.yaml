headline: Children & Families
deck: From our youngest members to our teenagers, Emmanuel is a place where children and families are
  warmly welcomed into the life of the church.
intro_paragraphs:
- Children and youth make up a core part of our church community at Emmanuel — and we know how much they
  have to teach us about spirituality and questions of faith.
- 'For this reason we invest heavily in their Christian growth: for our youngest members through the Joyful
  Noise congregation, and for older children and young people through Children''s & Youth Church, singing
  in the choir, joining the serving team, and helping to lead the readings and intercessions at our monthly
  intergenerational worship.'
callout_heading: Come and join us.
callout_body: Whether on a Sunday morning or at Thursday's Stay and Play, we'd love to welcome you and
  your family to Emmanuel.
card_sections:
- heading: null
  eyebrow: null
  layout: cards
  cards:
  - eyebrow: Ages 4–11 · Godly Play
    title: Children's Church
    body: 'Throughout term time, Children''s Church meets during the 10:30 Sunday service. Our curriculum
      follows the Godly Play method of Bible storytelling — an approach which seeks to inspire curiosity
      and wonder in our younger members.


      It fosters a sense of the overwhelming love God has for all God''s people, helping each child discover
      their own place in the story of faith.'
  - eyebrow: Ages 9–11 · Up to Year 7
    title: Youth Church
    body: 'Youth Church typically involves some games, music and a lively exploration of the Gospel of
      the Day, or a chosen topic for the term.


      Older children are welcome to join, but we find that by Year 7 they tend to be ready to join us
      for the service in church — singing, serving, or leading prayers and readings.'
features:
- eyebrow: Thursdays in term time
  heading: Stay and Play
  body_paragraphs:
  - Stay and Play happens every Thursday in term time, 9:30 to 11:00am. This is a relaxed, friendly drop-in
    session with loads of great toys and usually a bit of a sing-song at the end.
  - It's a great way to meet other local parents and carers, and to get answers to questions about life
    in West Hampstead with kids. Coffee, toast and healthy snacks are provided, and one of the clergy
    or our youth worker is always around to host.
  - All babies, toddlers and pre-school age children, together with their parents and carers, are warmly
    welcome — with plenty of tea and coffee for the adults.
