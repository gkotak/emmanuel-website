headline: Funerals & Memorials
deck: We have experience in walking with people through these difficult times, and will do our best to
  support you as you navigate the sadness and challenges of grief.
intro_paragraphs:
- We know that arranging a funeral or a memorial service can be a very overwhelming experience.
- We have experience in walking with people in these difficult times and will do our best to support you
  as you navigate the sadness and challenges of grief.
- In helping you plan and prepare for a funeral or memorial service, we will do our best to help the love
  of God feel close to you. We are here to pray for and with you, and to work with you to put together
  a service that honours your loved one in the way that feels most right for you.
- If you would like to discuss a funeral, please contact the parish office. We will respond with care
  and without delay.
callout_heading: We are here for you.
callout_body: Whenever you are ready, the parish office will help you take the next step — there is no
  rush, and no question too small.
