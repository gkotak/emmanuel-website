headline: Come as you are.
deck: Whether you've been going to Anglican churches all your life or this is the first time you'll step
  inside, we hope you'll find a warm welcome.
intro_paragraphs:
- We hope you will find a warm welcome when you first attend Emmanuel — whether in the week or on Sundays.
  Please do introduce yourself to one of the welcomers or clergy; we'll be happy to tell you more about
  our congregation and community life.
- Whilst we are proud of our Anglican identity, we are a very international community, with a number of
  different Christian denominations represented in our congregation.
- To help each of us find a place in worship, we have a number of services of Holy Communion during the
  week and on Sundays. Don't hesitate to contact a member of the clergy if you'd like to learn more. Even
  better, just come and visit!
- At our main Parish Mass you can expect a robed choir, acolytes and incense, with a team of servers who
  reflect the diversity of our congregation. Our said Eucharists are more simple, and Joyful Noise is
  more noisy! The thread that ties them together is Eucharistic-centred worship.
- We are working hard to make Emmanuel an inclusive and welcoming space. The Church is accessible to wheelchair
  and mobility scooter users via the Bell Porch entrance. Disabled toilets are located at the back of
  the church. The Church has a hearing aid loop installed.
- The vicar aims to meet new members of the congregation for a 1-1 meeting within six months of their
  arrival. Please contact her if you'd like to arrange a meeting.
callout_heading: Still have a question?
callout_body: Don't hesitate to contact a member of the clergy if you'd like to learn more — or simply
  come along this Sunday.
featured_services:
- slug: sung-eucharist
  body: Our main Parish Mass — a robed choir, incense and the fullest celebration of the liturgy. Children's
    & Youth Church meet during term.
- slug: said-eucharist-bcp
  body: A quiet, simple, 30-minute service said according to the Book of Common Prayer — a reflective
    start to the week.
- slug: joyful-noise-eucharist
  body: A lively, noisy celebration of the Mass for pre-school children and their families, with music
    led on the guitar. Does not meet during the school summer holidays.
access_cards:
- eyebrow: null
  title: Step-free access
  body: Both Emmanuel and St Cuthbert's are accessible for wheelchairs, with bathrooms for disabled access
    at both buildings.
- eyebrow: null
  title: Hearing loop
  body: Our sound system at Emmanuel is fitted with a hearing aid loop throughout the church.
- eyebrow: null
  title: Disabled access bathroom
  body: Disabled toilets are located at the back of the church.
