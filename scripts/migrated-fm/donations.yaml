headline: Every gift keeps the doors open.
deck: It costs £15,000 a month to run Emmanuel. We raise all of it ourselves, locally — it doesn't come
  from the Government or the Church of England.
intro_paragraphs:
- While we hold fundraising events and rent out the church, one of the foundations of our finances is
  the tremendous support we receive from our congregation through regular donations.
