headline: Service & Prayer Times
deck: The Eucharist and the daily office shape the rhythm of our shared life. All are welcome at every
  service.
intro_paragraphs:
- As we gather to meet with Christ and one another, we seek to be a place where we are supported on our
  spiritual journeys, inspired to connect faith with the rest of our lives, and encouraged to put that
  faith into action.
- The Eucharist sits at the heart of our understanding of who we are at Emmanuel. From the very young
  to the very old, we seek to equip our community to discover more fully the presence of God in their
  lives.
callout_heading: Join us in prayer.
callout_body: Whether for the first time or the thousandth, there is a place for you at the table at Emmanuel.
