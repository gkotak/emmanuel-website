headline: A church in the heart of West Hampstead
deck: An inclusive community in the catholic tradition of the Church of England, in the heart of West
  Hampstead since 1897.
intro_paragraphs:
- Emmanuel is a diverse, inclusive church in the liberal catholic tradition. Together, we are learning
  to be a community of faith shaped by the celebration of the Eucharist, a regular pattern of prayer and
  a vocation to share the all-encompassing love of God with the parish we serve.
- Wherever you find yourself on your journey of exploration of the Christian faith — curious, doubtful,
  seeking, ambivalent or long-time devout believer — we trust you will find a warm welcome at Emmanuel.
callout_heading: Wherever you find yourself, you are welcome here.
